
spring.application.name=yedekparca

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/yedekparca_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000
app.storage.r2.endpoint=${R2_ENDPOINT}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.bucket=${R2_BUCKET}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL}
app.storage.max-file-size=5242880
