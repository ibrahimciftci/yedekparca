app.demo.enabled=false
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://parcahan.vercel.app}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
