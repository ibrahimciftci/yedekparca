# Isolated demo datasource; credentials must come from environment variables.
spring.datasource.url=${DEMO_DB_URL:jdbc:postgresql://localhost:5432/yedekparca_demo_db}
spring.datasource.username=${DEMO_DB_USERNAME:postgres}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
app.demo.enabled=true
app.demo.expected-database=yedekparca_demo_db
app.demo.seed-password=${DEMO_SEED_PASSWORD:}
